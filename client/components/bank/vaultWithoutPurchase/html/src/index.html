<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Save Bank ACH Payment - PayPal Web SDK</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      .buttons-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #ach-button {
        padding: 12px 24px;
        font-size: 16px;
        cursor: pointer;
        background-color: #0070ba;
        color: white;
        border: none;
        border-radius: 4px;
      }
      #ach-button:hover {
        background-color: #005a94;
      }
      #ach-button:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
      }
    </style>
  </head>

  <body>
    <h1>Save Bank ACH Payment</h1>
    <p>Link your bank account for future payments without making a purchase now.</p>

    <div class="buttons-container">
      <button id="ach-button" hidden>Save Bank Account</button>
    </div>
    <script src="app.js"></script>

    <script>
      // Dynamically load SDK based on environment
      const sdkUrl = import.meta.env.LOCAL_SDK
        ? '/web-sdk/v6/core'
        : 'https://www.sandbox.paypal.com/web-sdk/v6/core';

      const script = document.createElement('script');
      script.async = true;
      script.src = sdkUrl;
      script.onload = () => onPayPalWebSdkLoaded();
      document.head.appendChild(script);
    </script>
  </body>
</html>
